name: Deploy Website
on:
  push:
    branches:
      - main

jobs:
  deploy_website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build website
        run: yarn build
__DEPLOY_WORKFLOW_CONFIG_BLOCK__
      - name: Deploy website
        run: yarn deploy
        env:
__DEPLOY_WORKFLOW_ENV_BLOCK__
