name: Publish Package
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Configure registry auth
        run: |
          cat <<EOF > "$HOME/.npmrc"
          //npm.pkg.github.com/:_authToken=${GIT_HUB_TOKEN}
          always-auth=true
          EOF
        env:
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate root package
        run: yarn validate:package

      - name: Capture package metadata
        id: package
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          github_name=$(node -e "const pkg = require('./package.json'); const owner = (process.env.GITHUB_REPOSITORY_OWNER || '').toLowerCase(); process.stdout.write('@' + owner + '/' + pkg.name);")
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "github_name=${github_name}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Prepare GitHub Packages bundle
        run: yarn prepare:github-package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Validate GitHub Packages publish preconditions
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "GIT_HUB_TOKEN is required for publishing to GitHub Packages."
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published to GitHub Packages."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.github_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Publish to GitHub Packages
        run: npm publish ./.publish/github-package --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
