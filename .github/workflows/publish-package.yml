name: Publish Package
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish_package:
    runs-on: ubuntu-latest
    env:
      GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Use npm with trusted-publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate root package
        run: yarn validate:package

      - name: Verify publish tarball
        run: yarn pack --out "${RUNNER_TEMP}/npm-package.tgz"

      - name: Capture package metadata
        id: package
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          github_name="@$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/${package_name}"
          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "github_name=${github_name}"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Check npm registry state
        id: npm_state
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm. Skipping npm publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Publish to npm via trusted publishing
        if: steps.npm_state.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          empty_npmrc="${RUNNER_TEMP}/oidc.npmrc"
          : > "$empty_npmrc"
          echo "npm=$(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN \
            NPM_CONFIG_USERCONFIG="$empty_npmrc" \
            npm publish --provenance --access public --registry https://registry.npmjs.org/

      - name: Configure GitHub Packages auth
        run: |
          set -euo pipefail
          if [ -z "${GIT_HUB_TOKEN}" ]; then
            echo "GIT_HUB_TOKEN secret is missing."
            exit 1
          fi
          github_npmrc="${RUNNER_TEMP}/github-packages.npmrc"
          {
            echo '//npm.pkg.github.com/:_authToken=${GIT_HUB_TOKEN}'
            echo '@jmrsquared:registry=https://npm.pkg.github.com'
          } > "$github_npmrc"
          chmod 600 "$github_npmrc"
          echo "NPM_CONFIG_USERCONFIG=$github_npmrc" >> "$GITHUB_ENV"

      - name: Prepare GitHub Packages bundle
        run: yarn prepare:github-package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Check GitHub Packages state
        id: github_state
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on GitHub Packages. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.github_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Publish to GitHub Packages
        if: steps.github_state.outputs.should_publish == 'true'
        run: npm publish ./.publish/github-package --registry https://npm.pkg.github.com/
        env:
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Publish Package"
            echo ""
            echo "| Registry | Version | Result |"
            echo "| --- | --- | --- |"
            echo "| npm | ${PACKAGE_VERSION} | ${NPM_RESULT} |"
            echo "| GitHub Packages | ${PACKAGE_VERSION} | ${GITHUB_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          NPM_RESULT: ${{ steps.npm_state.outputs.should_publish == 'true' && 'published' || 'skipped (already published)' }}
          GITHUB_RESULT: ${{ steps.github_state.outputs.should_publish == 'true' && 'published' || 'skipped (already published)' }}
