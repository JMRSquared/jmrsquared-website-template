name: Publish Package
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish_package:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Corepack activates yarn 4 in the next step; the default cache probe
          # shells out to the runner's yarn 1 and fails on the packageManager field.
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Use latest npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Configure registry auth
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret is missing. Create a granular access token on npmjs.com"
            echo "with read+write on create-jmrsquared-website-template and 2FA bypass enabled."
            exit 1
          fi
          {
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'
            echo '//npm.pkg.github.com/:_authToken=${GIT_HUB_TOKEN}'
          } > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate root package
        run: yarn validate:package

      - name: Verify publish tarball
        run: yarn pack --out "${RUNNER_TEMP}/npm-package.tgz"

      - name: Capture package metadata
        id: package
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          github_name="@$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/${package_name}"
          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "github_name=${github_name}"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Check npm registry state
        id: npm_state
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm. Skipping npm publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Publish to npm
        if: steps.npm_state.outputs.should_publish == 'true'
        run: npm publish --provenance --access public --registry https://registry.npmjs.org/
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Prepare GitHub Packages bundle
        run: yarn prepare:github-package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Check GitHub Packages state
        id: github_state
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on GitHub Packages. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.github_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Publish to GitHub Packages
        if: steps.github_state.outputs.should_publish == 'true'
        run: npm publish ./.publish/github-package --registry https://npm.pkg.github.com/

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Publish Package"
            echo ""
            echo "| Registry | Version | Result |"
            echo "| --- | --- | --- |"
            echo "| npm | ${PACKAGE_VERSION} | ${NPM_RESULT} |"
            echo "| GitHub Packages | ${PACKAGE_VERSION} | ${GITHUB_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          NPM_RESULT: ${{ steps.npm_state.outputs.should_publish == 'true' && 'published' || 'skipped (already published)' }}
          GITHUB_RESULT: ${{ steps.github_state.outputs.should_publish == 'true' && 'published' || 'skipped (already published)' }}
